[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "univpn-tcp-forward"
dynamic = ["version"]
description = "Experimental UniVPN/Huawei SSL VPN single-target TCP forwarder"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.scripts]
univpn-forward = "univpn_forward.cli:main"

[tool.setuptools.dynamic]
version = {attr = "univpn_forward.__version__"}

[tool.setuptools.packages.find]
include = ["univpn_forward*"]
