name: Native desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Management and UI syntax tests
        run: |
          python -m unittest discover -s tests -v
          node --check univpn_client/ui/app.js
      - name: Prepare pinned upstream and patches
        run: python scripts/prepare_native.py
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config openssl@3
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libssl-dev libxml2-dev zlib1g-dev patchelf python3-dev libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 policykit-1 iproute2
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel autoconf automake libtool make pkgconf
            mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
            mingw-w64-x86_64-headers
            mingw-w64-x86_64-libxml2 mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ca-certificates
      - name: Build and test Unix native core
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/openconnect
          sh ../../scripts/build_native.sh
      - name: Build Windows native core
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd build/openconnect
          sh ../../scripts/build_native.sh
      - name: OpenSSL license
        shell: bash
        run: |
          curl -fL https://raw.githubusercontent.com/openssl/openssl/master/LICENSE.txt -o build/OpenSSL-LICENSE.txt
      - name: Stage macOS core
        if: runner.os == 'macOS'
        run: python scripts/stage_macos_core.py --source build/openconnect --openssl-license build/OpenSSL-LICENSE.txt
      - name: Stage Linux core
        if: runner.os == 'Linux'
        run: python scripts/stage_other_core.py --source build/openconnect --openssl-license build/OpenSSL-LICENSE.txt
      - name: Official Windows tunnel driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile build/wintun.zip
          Expand-Archive build/wintun.zip build/wintun
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - name: Stage Windows core
        if: runner.os == 'Windows'
        run: python scripts/stage_other_core.py --source build/openconnect --openssl-license build/OpenSSL-LICENSE.txt --wintun build/wintun/wintun/bin/amd64/wintun.dll --wintun-license build/wintun/wintun/COPYING
      - name: Install desktop build dependencies
        run: uv pip install --system '.[desktop,build]'
      - name: Install Linux GTK bridge
        if: runner.os == 'Linux'
        run: uv pip install --system 'PyGObject==3.48.2' pycairo
      - name: Freeze and package
        run: |
          python scripts/dependency_sources.py
          python scripts/build_desktop.py
          python scripts/package_desktop.py
      - name: CLI smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: '"dist/UniVPN Connect/UniVPN Connect" --version'
      - name: Windows CLI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist/UniVPN Connect/UniVPN Connect.exe" --version'
      - name: Matching native source
        shell: bash
        run: |
          python scripts/prepare_native.py --destination build/release-source --archive build/openconnect-upstream.tar.gz
          tar -czf dist/packages/openconnect-source-${{ matrix.os }}.tar.gz -C build release-source
          python scripts/sanitize_archives.py dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/packages/
