name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/tests.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check tag and extract version-specific notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from univpn_forward import __version__
          if os.environ['GITHUB_REF_NAME'] != 'v' + __version__:
              raise SystemExit('Tag does not match package version')
          marker = '## ' + __version__ + ' — '
          text = Path('CHANGELOG.md').read_text()
          sections = [s for s in text.split('\n## ') if ('## ' + s).startswith(marker)]
          if len(sections) != 1:
              raise SystemExit('Expected one changelog section for this version')
          Path('release-notes.md').write_text(sections[0].split('\n', 1)[1].strip() + '\n')
          PY
      - run: uv build
      - name: Generate checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assets = sorted(p for p in Path('dist').iterdir() if p.name.endswith(('.whl', '.tar.gz')))
          if len(assets) != 2:
              raise SystemExit('Expected one wheel and one source archive')
          Path('dist/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in assets))
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(python -m univpn_forward --version)
          flags=()
          if [[ "$version" =~ (a|b|rc)[0-9]+ ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$tag" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "UniVPN TCP Forward $version" \
            --notes-file release-notes.md "${flags[@]}"
